server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # nginx does not merge child add_header directives with the parent block.
  # The security-header snippet is included again in every cached location.
  include /etc/nginx/security-headers.conf;

  location /api/ {
    proxy_pass http://sigurdos-backend:8082;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ~ ^/(latest|dev|debug|archive)/ {
    proxy_pass http://sigurdos-backend:8082;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
  }

  location ~* \.(css|js)$ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  location /assets/vendor/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
