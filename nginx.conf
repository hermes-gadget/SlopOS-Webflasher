server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.github.com https://github.com https://*.githubusercontent.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; img-src 'self' https://*.githubusercontent.com data:; frame-src 'self';" always;

  location = / {
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }

  location ~* \.(css|js)$ {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  location /assets/vendor/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
